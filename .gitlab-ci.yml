---
variables:
  PY_COLORS: "1"
  ANSIBLE_FORCE_COLOR: "1"
  GIT_HTTP_USER: gitlab-ci-token
  GIT_HTTP_PASSWORD: ${CI_JOB_TOKEN}
  DOCKER_HOST: tcp://docker:2375/
  DOCKER_TLS_CERTDIR: ""
  BRANCH_NAME: "ansible-core-2.19"

default:
  tags:
    - docker
    - castle.real-time.com
  before_script:
    - git fetch origin $BRANCH_NAME
    - git checkout $BRANCH_NAME

stages:
  - lint
  - test

# Lint stage
lint:
  stage: lint
  image: python:3.13
  needs: ["checkout"]
  before_script:
    - pip install yamllint ansible-lint
  script:
    - yamllint .
    - ansible-lint .

# Molecule stage with matrix for multiple distros
molecule:
  stage: test
  image: python:3.13
  services:
    - name: docker:24-dind
  needs: ["checkout"]
  parallel:
    matrix:
      - DISTRO: ubuntu2404
      - DISTRO: ubuntu2204
      - DISTRO: debian13
      - DISTRO: debian12
      - DISTRO: debian11
  before_script:
    - apt-get update && apt-get install -y docker.io git bash
    - chmod 755 $CI_PROJECT_DIR
    - pip install --upgrade pip
    - pip install ansible molecule "molecule-plugins[docker]" docker
  script:
    - echo "Running Molecule tests for $DISTRO"
    - MOLECULE_DISTRO=$DISTRO molecule test
