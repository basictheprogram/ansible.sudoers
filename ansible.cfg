[defaults]
interpreter_python = auto

# Paths to search for collections and roles (colon separated)
collections_path = /workspace/collections
roles_path = /workspace/roles

remote_user = ansible
retry_files_enabled = False

# Uncomment and configure as needed:
# gather_facts = implicit

host_key_checking = False

# Uncomment if you want to restrict fact namespace:
# restrict_facts_namespace = True

# Uncomment and configure vault password file if used
# vault_password_file = /path/to/vault_password_file

[privilege_escalation]
# become=True
# become_method=sudo
# become_user=root
# become_ask_pass=False

[ssh_connection]
# Enable SSH compression and ControlMaster for performance
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o ForwardAgent=yes

# Uncomment and configure persistent ControlPath directory if needed
# control_path_dir = ~/.ansible/cp

# Uncomment if you want to override pipelining (recommended True for speed)
pipelining = False

[persistent_connection]
# Default persistent connection idle timeout in seconds
# connect_timeout = 30

# Default connect retries and intervals for persistent connections
# connect_retries = 30
# connect_interval = 1

[colors]
# Customize colors if you want, or leave as defaults

[diff]
# Enable diff output by default (if desired)
# always = no
# context = 3
