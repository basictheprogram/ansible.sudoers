---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    roles-path: molecule/default/roles
    force: true

driver:
  name: docker

platforms:
  - name: instance
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2204}-ansible:latest"
    tmpfs:
      - /run
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true

lint: |
  set -e
  yamllint .
  ansible-lint .

provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
  inventory:
    host_vars:
      tweak_motd: true

verifier:
  name: testinfra
