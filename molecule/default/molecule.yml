---
dependency:
  name: Galaxy
driver:
  name: Docker
lint: |
  set -e
  yamllint .
  ansible-lint .
platforms:
  - name: Sudoers-molecule-jammy-instance
    image: "geerlingguy/docker-ubuntu2204-ansible"
    tmpfs:
      - /run
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    privileged: true
    pre_build_image: true
provisioner:
  name: Ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
  inventory:
    host_vars:
      tweak_motd: true
verifier:
  name: Testinfra
