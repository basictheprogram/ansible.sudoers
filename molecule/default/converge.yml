---
- name: Converge
  hosts: all
  become: true

  vars:
    management_user:
      - username: testuser1
      - username: testuser2
    group_support_users:
      - username: testuser3
      - username: veeam12

  pre_tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        force_apt_get: true
      changed_when: false
      when: ansible_facts.os_family == 'Debian'
    - name: Update dnf cache
      ansible.builtin.dnf:
        update_cache: true
      changed_when: false
      when: ansible_facts.os_family == 'RedHat'

  roles:
    - role: realtime.sudoers
