---
- name: Configure Ubuntu monolith sudoers file
  ansible.builtin.include_tasks: monolithic_sudoers.yml
  when:
    - ansible_distribution_major_version | int < 20
  tags: sudoers

- name: Configure Ubuntu sudoers
  ansible.builtin.include_tasks: sudoers.yml
  when:
    - ansible_distribution_major_version | int >= 20
  tags: sudoers
