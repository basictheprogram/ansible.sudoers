---
# Ubuntu 26+ sudoers configuration
# Note: Ubuntu 26 ships several system utilities rewritten in Rust
# (e.g. sudo-rs) that are not backwards compatible with older sudo
# configurations. Tasks here should use module options and command
# paths appropriate for the new toolchain.

- name: Make sure ssh-agent works via sudo (Ubuntu 26+)
  ansible.builtin.copy:
    content: |
      Defaults    env_keep += "SSH_AUTH_SOCK"

    dest: "/etc/sudoers.d/ssh_auth_sock"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -csf %s
  tags: sudoers

- name: Management users can sudo NOPASSWD (Ubuntu 26+)
  community.general.sudoers:
    name: "{{ item.username }}"
    state: present
    user: "{{ item.username }}"
    commands: ALL
    nopassword: true
  loop: "{{ management_user }}"
  tags: sudoers

- name: Remove legacy logfile sudoers drop-in (Ubuntu 26+)
  ansible.builtin.file:
    path: /etc/sudoers.d/logfile
    state: absent
  tags: sudoers

- name: Include veeam12 sudoers tasks (Ubuntu 26+)
  ansible.builtin.include_tasks: veeam12.yml
  tags: sudoers

- name: Ensure all files in /etc/sudoers.d/ have mode 0440 (Ubuntu 26+)
  ansible.builtin.find:
    paths: /etc/sudoers.d/
    recurse: true
    file_type: file
  register: sudoers_files
  tags: sudoers

- name: Set mode to 0440 for files in /etc/sudoers.d/ (Ubuntu 26+)
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: "0440"
  loop: "{{ sudoers_files.files }}"
  when: sudoers_files.matched > 0
  tags: sudoers
