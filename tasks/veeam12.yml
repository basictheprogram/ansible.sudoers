---
- name: Check if veeam12 is in the user list
  ansible.builtin.debug:
    msg: "'veeam12' found in group_support_users"
  when: "'veeam12' in (group_support_users | selectattr('username', 'equalto',
    'veeam12') | map(attribute='username') | list)"
  tags: sudoers

- name: Configure sudoers from veeam12
  when: >
    'veeam12' in (group_support_users
      | selectattr('username', 'equalto', 'veeam12')
      | map(attribute='username')
      | list)
  tags: sudoers
  block:
    - name: Veeam12 can sudo VEEAM12_COMMANDS
      ansible.builtin.copy:
        content: |
          Cmnd_Alias VEEAM12_COMMANDS = /usr/bin/whoami, \
            /usr/bin/id, \
            /usr/bin/tar, \
            /usr/bin/gzip, \
            /usr/bin/touch, \
            /usr/bin/uname, \
            /sbin/blkid, \
            /usr/bin/cat, \
            /usr/bin/mkdir, \
            /usr/bin/ls, \
            /usr/bin/arch, \
            /usr/sbin/lvs, \
            /usr/bin/chmod, \
            /usr/bin/updatedb, \
            /usr/bin/cp, \
            /usr/bin/btrfs, \
            /usr/bin/ln, \
            /usr/bin/sh, \
            /tmp/*, \
            /usr/bin/rm -f /var/lib/veeam12/*, \
            /usr/bin/rm -rf /tmp/*, \
            /usr/bin/rm -f /tmp/*

          veeam12 ALL=(root) NOPASSWD: VEEAM12_COMMANDS
        dest: /etc/sudoers.d/veeam12
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -csf %s
