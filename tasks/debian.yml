---
- name: Configure Debian monolith sudoers file
  ansible.builtin.include_tasks: monolithic_sudoers.yml
  when:
    - ansible_distribution_major_version | int < 6
  tags: sudoers

- name: Configure Debian sudoers
  ansible.builtin.include_tasks: sudoers.yml
  when:
    - ansible_distribution_major_version | int >= 6
  tags: sudoers
