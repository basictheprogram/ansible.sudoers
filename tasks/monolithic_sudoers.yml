---
# Legacy OS (Ubuntu < 20) sudoers configuration.
# Uses drop-in files under /etc/sudoers.d/ rather than editing
# /etc/sudoers directly. Each file is validated by visudo before
# being written, ensuring a broken config is never committed.

- name: Running on an old OS
  ansible.builtin.debug:
    msg: "Warning: Old OS version, proceeding anyway."
  tags: sudoers

- name: Make sure ssh-agent works via sudo
  ansible.builtin.copy:
    content: |
      Defaults    env_keep += "SSH_AUTH_SOCK"

    dest: "/etc/sudoers.d/ssh_auth_sock"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -csf %s
  tags: sudoers

- name: Disable requiretty
  ansible.builtin.copy:
    content: |
      Defaults    !requiretty

    dest: "/etc/sudoers.d/disable_requiretty"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -csf %s
  tags: sudoers

- name: Ansible can sudo NOPASSWD
  ansible.builtin.copy:
    content: |
      ansible ALL=(ALL) NOPASSWD:ALL

    dest: "/etc/sudoers.d/ansible"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -csf %s
  tags: sudoers
